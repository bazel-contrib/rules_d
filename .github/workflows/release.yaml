# Cut a release whenever a new tag is pushed to the repo.
name: Release
on:
  # Called explicitly after release-please creates a release.
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
  # Retry packaging for an existing tag if a previous release failed.
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing git tag to release
        required: true
        type: string
  # Or, developers can manually push a tag from their clone
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      generate-release-notes: ${{ steps.notes.outputs.generate-release-notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}
      - name: Choose release notes source
        id: notes
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          entry=""
          # Older manually pushed tags may predate this helper.
          if [[ -f .github/workflows/changelog_entry.sh ]]; then
            entry=$(bash .github/workflows/changelog_entry.sh "$TAG_NAME")
          fi
          if [[ -n "$entry" ]]; then
            echo "generate-release-notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate-release-notes=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: notes
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@1d798ff015ed0696433e01e2c3ccbb2abefadad7 # v7.7.0 # renovate:ignore 1d798ff015ed0696433e01e2c3ccbb2abefadad7
    with:
      release_files: rules_d-*.tar.gz
      prerelease: false
      generate_release_notes: ${{ needs.notes.outputs.generate-release-notes == 'true' }}
      tag_name: ${{ inputs.tag_name || github.ref_name }}
  publish:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
